<!doctype html>
<html lang="es">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Tienda VJ</title>
    <style>
        .game-card {
            margin-bottom: 1.5rem;
        }

        .game-card .card-img-top {
            height: 190px;
            object-fit: cover;
        }

        .cart-item img {
            width: 56px;
            height: 56px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <!-- As a link -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> 
                <img src="/img/logo-store.png" alt="Logo de la tienda de videojuegos" width="30" height="30"
                    class="d-inline-block align-text-top">            
                Tienda de videojuegos
            </a>
            <form class="d-flex ms-auto mt-2 mt-lg-0" th:action="@{/listado}" method="get">
                <label for="busquedaVideojuegos" class="visually-hidden">Buscar videojuegos</label>
                <input type="search" id="busquedaVideojuegos" class="form-control"
                    name="q" th:value="${busqueda}" placeholder="Buscar..."
                    aria-label="Buscar videojuegos" autocomplete="off">
                <button type="submit" class="btn btn-primary ms-2">Buscar</button>
            </form>
            <button type="button" class="btn btn-warning text-dark ms-lg-3 mt-2 mt-lg-0" data-bs-toggle="modal"
                data-bs-target="#carritoModal" aria-label="Abrir carrito">
                <i class="bi bi-cart-fill" aria-hidden="true"></i>
                Carrito <span class="badge" th:classappend="${totalProductos == 0 ? 'bg-danger' : 'bg-success'}"
                    th:text="${totalProductos}">0</span>
            </button>
            <a class="btn btn-light text-dark ms-lg-2 mt-2 mt-lg-0" th:href="@{/videojuegos}">
                Administrar juegos
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-3 game-card" th:each="videojuego : ${videojuegos}">
                <div class="card">
                    <img th:src="${videojuego.imagenUrl}" class="card-img-top"
                        th:alt="${videojuego.titulo}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${videojuego.titulo}">Videojuego</h5>
                        <p class="card-text" th:text="${videojuego.descripcion}">Descripcion</p>
                        <form th:action="@{/carrito/agregar/{id}(id=${videojuego.id})}" method="post">
                            <button type="submit" class="btn btn-primary">
                            Agregar al carrito
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(videojuegos)}" class="text-center text-muted mt-4">
            No se encontraron videojuegos.
        </p>
    </div>

    <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="carritoModalLabel">Tu carrito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div th:if="${#lists.isEmpty(carrito)}" class="text-center text-muted">
                        El carrito está vacío.
                    </div>
                    <div th:each="item : ${carrito}" class="cart-item d-flex align-items-center gap-2 border-bottom pb-2 mb-2">
                        <img th:src="${item.videojuego.imagenUrl}" th:alt="${item.videojuego.titulo}" class="rounded">
                        <div class="flex-grow-1">
                            <div class="fw-bold" th:text="${item.videojuego.titulo}">Videojuego</div>
                            <small class="text-muted">Cantidad: <span th:text="${item.cantidad}">1</span></small>
                        </div>
                        <form th:action="@{/carrito/{id}/disminuir(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary" aria-label="Quitar una unidad">-</button>
                        </form>
                        <form th:action="@{/carrito/{id}/aumentar(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-primary" aria-label="Agregar una unidad">+</button>
                        </form>
                        <form th:action="@{/carrito/{id}/eliminar(id=${item.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger" aria-label="Eliminar del carrito">&times;</button>
                        </form>
                    </div>
                </div>
                <div class="modal-footer justify-content-between">
                    <form th:action="@{/carrito/vaciar}" method="post">
                        <button type="submit" class="btn btn-outline-danger">Vaciar carrito</button>
                    </form>
                    <span class="fw-bold">Productos: <span th:text="${totalProductos}">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    -->
</body>

</html>
