<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Administrar videojuegos</title>
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/listado}">Tienda de videojuegos</a>
            <a class="btn btn-outline-light" th:href="@{/listado}">Volver a la tienda</a>
        </div>
    </nav>

    <main class="container pb-5">
        <div th:if="${mensaje}" class="alert alert-info" role="alert" th:text="${mensaje}"></div>

        <div class="row g-4">
            <div class="col-lg-5">
                <section class="card shadow-sm">
                    <div class="card-body">
                        <h1 class="h4 mb-4" th:text="${videojuego.id == null ? 'Agregar videojuego' : 'Editar videojuego'}">
                            Agregar videojuego
                        </h1>
                        <form th:action="@{/videojuegos/guardar}" method="post">
                            <input type="hidden" name="id" th:value="${videojuego.id}">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" id="titulo" name="titulo" class="form-control"
                                    th:value="${videojuego.titulo}" required maxlength="120">
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea id="descripcion" name="descripcion" class="form-control" rows="3"
                                    required maxlength="500" th:text="${videojuego.descripcion}"></textarea>
                            </div>
                            <div class="mb-4">
                                <label for="imagenUrl" class="form-label">URL de imagen</label>
                                <input type="url" id="imagenUrl" name="imagenUrl" class="form-control"
                                    th:value="${videojuego.imagenUrl}" required maxlength="500">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary"
                                    th:text="${videojuego.id == null ? 'Agregar juego' : 'Guardar cambios'}">
                                    Agregar juego
                                </button>
                                <a th:if="${videojuego.id != null}" th:href="@{/videojuegos}"
                                    class="btn btn-outline-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-lg-7">
                <section class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4 mb-4">Videojuegos registrados</h2>
                        <div th:if="${#lists.isEmpty(videojuegos)}" class="text-muted">
                            No hay videojuegos registrados.
                        </div>
                        <div class="table-responsive" th:unless="${#lists.isEmpty(videojuegos)}">
                            <table class="table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Título</th>
                                        <th>Descripción</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="juego : ${videojuegos}">
                                        <td th:text="${juego.titulo}">Videojuego</td>
                                        <td th:text="${juego.descripcion}">Descripción</td>
                                        <td class="text-end text-nowrap">
                                            <a th:href="@{/videojuegos/editar/{id}(id=${juego.id})}"
                                                class="btn btn-sm btn-outline-primary">Editar</a>
                                            <form th:action="@{/videojuegos/eliminar/{id}(id=${juego.id})}" method="post"
                                                class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                                    onclick="return confirm('¿Eliminar este videojuego?');">Eliminar</button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>

</html>
